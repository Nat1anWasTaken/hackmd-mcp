# Local development database: `docker compose -f docker-compose.dev.yml up -d`
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hackmd_mcp
      POSTGRES_PASSWORD: hackmd_mcp
      POSTGRES_DB: hackmd_mcp
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
